# /etc/nginx/sites-available/juegos.itcanarias.com  (en Debian/Ubuntu)
# Solo afecta a juegos.itcanarias.com: el resto de webs del servidor no cambia.
map $http_upgrade $juegos_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name juegos.itcanarias.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $juegos_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;     # partidas largas: la conexión se mantiene abierta
        proxy_send_timeout 3600s;
    }
}
# El certificado HTTPS lo añade certbot:  sudo certbot --nginx -d juegos.itcanarias.com
