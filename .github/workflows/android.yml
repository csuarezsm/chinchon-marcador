name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: Preparar clave de firma
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/chinchon-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/chinchon-release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la clave fija"
          else
            echo "::warning::Sin clave fija: el APK no podrá actualizar al anterior"
          fi
      - name: Compilar APK
        working-directory: android
        env: { ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk chinchon.apk
      - name: Publicar versión
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle)
          grep -q "APP_VERSION = '$V'" www/index.html || { echo "::error::APP_VERSION en www/index.html no coincide con versionName $V"; exit 1; }
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release delete "v$V" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$V" chinchon.apk --latest --title "Chinchón v$V" --notes "$(git log -1 --pretty=%s)

          © 2026 IT Canarias"
