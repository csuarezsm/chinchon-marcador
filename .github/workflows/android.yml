name: APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci || npm install
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk chinchon.apk
      - name: Publicar APK como descarga directa
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest chinchon.apk --title "Chinchón (última versión)" --notes "APK listo para instalar en Android."
