<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="IT Canarias">
<meta name="copyright" content="© 2026 IT Canarias">
<meta name="theme-color" content="#0e3b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Chinchón · Marcador</title>
<style>
:root{
  --bg:#0b2a20; --felt:#0e3b2c; --card:#134a37; --card2:#1a5a43; --line:#2a6b52;
  --txt:#f3efe2; --mut:#a9c3b6; --gold:#e8b84a; --red:#e2574c; --blue:#5aa9e6; --ok:#62c98a;
  --r:14px; --on-gold:#2a1e00; --on-blue:#06233a; --outbg:#2b2b2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font:calc(16px * var(--fs, 1))/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--felt);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:calc(19px * var(--fs, 1));margin:0;flex:1;letter-spacing:.3px}
header h1 small{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut);font-weight:500}
main{padding:14px;max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--card2);cursor:pointer}
button:active{transform:scale(.97)}
button[disabled]{opacity:.4}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:700}
.btn-red{background:var(--red);color:#fff;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.icon{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:calc(20px * var(--fs, 1));background:transparent}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sec h2{font-size:calc(15px * var(--fs, 1));margin:0 0 10px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
label.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
label.f:first-of-type{border-top:0}
label.f span{flex:1;min-width:0}
label.f select{max-width:58%}
label.f em{display:block;font-style:normal;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
input,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=number]{width:90px;text-align:center}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
.plist .pr{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.plist .pr input{flex:1;min-width:0}
.plist .pr button{padding:10px 12px}
.dealpick{display:inline-block;width:calc(38px * var(--fs, 1));height:calc(38px * var(--fs, 1));border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:calc(12px * var(--fs, 1));color:var(--mut);flex:none}
.dealpick.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:800}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mut{color:var(--mut);font-size:calc(13px * var(--fs, 1))}

/* Marcador */
.status{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:8px 14px;font-size:calc(14px * var(--fs, 1))}
.chip b{color:var(--gold)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pc{background:var(--card);border-radius:var(--r);padding:12px;position:relative;border:2px solid transparent}
.pc.dealer{border-color:var(--gold)}
.pc.out{opacity:.55;background:var(--outbg)}
.pc .nm{font-weight:700;font-size:calc(16px * var(--fs, 1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.pc .tt{font-size:calc(40px * var(--fs, 1));font-weight:800;line-height:1.05;margin:4px 0;font-variant-numeric:tabular-nums}
.pc .bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.pc .bar i{display:block;height:100%;background:var(--ok)}
.pc .bar i.warn{background:var(--gold)}.pc .bar i.danger{background:var(--red)}
.pc .ft{font-size:calc(12px * var(--fs, 1));color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.pc .badge{position:absolute;top:10px;right:10px;width:calc(24px * var(--fs, 1));height:calc(24px * var(--fs, 1));border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:calc(11px * var(--fs, 1));font-weight:800;display:grid;place-items:center}
.pc .rb{margin-top:8px;width:100%;padding:8px;font-size:calc(14px * var(--fs, 1));background:var(--blue);color:var(--on-blue);font-weight:700}
.pc.lead .nm::after{content:" ▶";color:var(--blue);font-size:calc(12px * var(--fs, 1))}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:692px;margin:0 auto;
  padding:16px;font-size:calc(18px * var(--fs, 1));box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6}
.winner{background:var(--gold);color:var(--on-gold);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px}
.winner .big{font-size:calc(28px * var(--fs, 1));font-weight:900}
.winner .actions{display:flex;gap:8px;margin-top:12px}
.winner .actions button{flex:1;background:var(--on-gold);color:var(--gold);font-weight:700}

/* Historial */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:calc(14px * var(--fs, 1))}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card2);font-size:calc(13px * var(--fs, 1));max-width:90px;overflow:hidden;text-overflow:ellipsis}
td:first-child,th:first-child{text-align:left;padding-left:10px;color:var(--mut);position:sticky;left:0;background:var(--card)}
th:first-child{background:var(--card2)}
td .pt{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
td .to{font-weight:700}
td.out{color:var(--mut);opacity:.6}
td.cl .pt{color:var(--gold);font-weight:700}
tr.rebuy td{background:rgba(90,169,230,.12);font-size:calc(13px * var(--fs, 1))}
tr.hand{cursor:pointer}
tr.hand:active td{background:var(--card2)}
.dl{color:var(--gold);font-size:calc(11px * var(--fs, 1))}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--felt);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:calc(20px * var(--fs, 1))}
.sheet .sub{color:var(--mut);font-size:calc(13px * var(--fs, 1));margin-bottom:12px}
.hrow{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hrow .top{display:flex;align-items:center;gap:10px}
.hrow .top .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .top .n small{display:block;font-weight:400;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.scbox{width:calc(84px * var(--fs, 1));min-height:48px;padding:8px;font-size:calc(22px * var(--fs, 1));font-weight:800;background:var(--bg);border:2px solid var(--line);border-radius:10px;flex:none}
.scbox.on{border-color:var(--gold);color:var(--gold)}
.scbox.fixed{opacity:.6}
.hrow.act{outline:2px solid var(--gold);outline-offset:-2px}
.kfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--felt);margin:6px -16px calc(-16px - env(safe-area-inset-bottom));padding:8px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypad button{padding:0;height:clamp(38px, 6.2vh, 54px);font-size:calc(22px * var(--fs, 1));font-weight:700;background:var(--card2);border-radius:10px}
.keypad .knext{background:var(--gold);color:var(--on-gold);font-size:calc(17px * var(--fs, 1));white-space:nowrap}
.kfoot .acts{margin-top:6px!important;gap:8px}
.kfoot .acts button{padding:10px}
.kfoot .err{min-height:0;margin:0 0 4px}
.hand .hrow{padding:6px 10px;margin-bottom:6px}
.hand .scbox{min-height:42px;padding:4px}
.hand .closebtn{padding:6px 8px}
.hand label.f{padding:2px 0}
#undoBar{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:692px;margin:0 auto;background:#000e;color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:15;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s;font-size:calc(15px * var(--fs, 1))}
#undoBar.on{opacity:1;transform:none;pointer-events:auto}
#undoBar span{flex:1}
#undoBar button{background:var(--gold);color:var(--on-gold);font-weight:800;padding:10px 14px;white-space:nowrap}
.closebtn{padding:8px 10px;font-size:calc(13px * var(--fs, 1));background:transparent;border:1px solid var(--line);white-space:nowrap}
.closebtn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.kinds{display:flex;gap:6px;margin-top:8px}
.kinds button{flex:1;min-width:0;overflow-wrap:anywhere;padding-left:4px;padding-right:4px;padding:8px 6px;font-size:calc(13px * var(--fs, 1));background:var(--bg);border:1px solid var(--line)}
.kinds button.on{background:var(--gold);color:var(--on-gold);font-weight:700;border-color:var(--gold)}
.sheet .acts{display:flex;gap:10px;margin-top:14px}
.sheet .acts button{flex:1;padding:14px}
.err{color:var(--red);font-size:calc(14px * var(--fs, 1));margin-top:8px;min-height:1em}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:calc(14px * var(--fs, 1));opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--card)}
.menu button.btn-gold{background:var(--gold);color:var(--on-gold)}
.menu button.btn-red{background:var(--red);color:#fff}
.donate{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-top:4px;text-align:center}
.donate .dt{font-weight:800;font-size:calc(17px * var(--fs, 1));color:var(--gold)}
.donate .dd{color:var(--mut);font-size:calc(14px * var(--fs, 1));margin:6px 0 12px}
.donate button{width:100%;padding:14px;font-size:calc(16px * var(--fs, 1))}
.copy{text-align:center;color:var(--mut);font-size:calc(12px * var(--fs, 1));padding:8px 0 4px;opacity:.8}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.th{padding:0;border-radius:14px;overflow:hidden;border:3px solid transparent;text-align:left;background:none}
.th.on{border-color:var(--gold)}
.th .pv{height:74px;padding:10px;display:flex;gap:6px;align-items:flex-end}
.th .pv i{flex:1;height:38px;border-radius:8px;display:block}
.th .pv b{width:26px;height:26px;border-radius:50%;display:block;flex:none}
.th .tn{padding:8px 10px;font-weight:700;font-size:calc(14px * var(--fs, 1));display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chipb{padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:calc(15px * var(--fs, 1))}
.chipb.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
#menuBtn.dot::after{content:'';position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--felt)}
#updBanner{display:none;background:var(--gold);color:var(--on-gold);font-weight:700;text-align:center;padding:10px 14px;cursor:pointer;font-size:calc(15px * var(--fs, 1))}
#updBanner.on{display:block}
.pf-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf-av{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;flex:none}
.pf-rating{font-size:calc(30px * var(--fs, 1));font-weight:800;color:var(--gold);line-height:1}
.pf-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.pf-kpi{background:var(--card);border-radius:12px;padding:10px 12px}
.pf-kpi span{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
.pf-kpi b{font-size:calc(22px * var(--fs, 1))}
.pf-kpi small,.pf-line small,.pf-t small{font-weight:400;color:var(--mut);font-size:calc(13px * var(--fs, 1))}
.pf-t{font-weight:700;color:var(--gold);margin:6px 0 6px;font-size:calc(14px * var(--fs, 1))}
.pf-box{background:var(--card);border-radius:12px;padding:6px 12px;margin-bottom:10px}
.pf-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pf-line:first-child{border-top:0}
.pf-h2h{display:flex;align-items:center;gap:10px;padding:6px 0}
.pf-h2h span{width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-h2h b{width:52px;text-align:right}
.pf-bar{flex:1;height:10px;border-radius:5px;background:var(--red);overflow:hidden;opacity:.9}
.pf-bar i{display:block;height:100%;background:var(--ok)}
.pf-months{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.pf-months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.pf-months i{display:block;width:100%;background:var(--card2);border-radius:5px 5px 0 0}
.pf-months small,.pf-months span{font-size:calc(11px * var(--fs, 1));color:var(--mut)}
.pt-opps{display:flex;gap:8px;margin-bottom:12px}
.pt-opp{flex:1;min-width:0;background:var(--card);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.pt-opp.turn{border-color:var(--gold)}
.pt-on{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-ot{font-size:calc(13px * var(--fs, 1));color:var(--mut)}
.pt-ob{display:flex;margin-top:4px;height:18px}
.pt-ob i{width:12px;height:18px;border-radius:3px;background:var(--card2);border:1px solid var(--line);margin-right:-4px}
.pt-mid{display:flex;justify-content:center;gap:28px;margin:6px 0 8px}
.pt-pile{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.pt-btn{padding:0;background:none;border-radius:10px}
.pt-btn[disabled]{opacity:1}
.pt-btn:not([disabled]) .pc-card{box-shadow:0 0 0 3px var(--gold)}
.pt-pile .pc-card{width:64px;font-size:22px}
.pt-log{text-align:center;color:var(--mut);font-size:calc(14px * var(--fs, 1));min-height:1.3em}
.pt-hint{text-align:center;font-size:calc(15px * var(--fs, 1));margin:6px 0 10px;min-height:1.3em}
.pt-hand{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap}
.pt-hand:not(.mini) .pc-card{flex:1 1 0;min-width:0;width:auto;max-width:58px}
.pt-hand:not(.mini) .pc-s{width:70%}
.pt-hand.mini{justify-content:flex-start;margin-top:6px}
.pt-info{text-align:center;color:var(--mut);font-size:calc(13px * var(--fs, 1));margin:10px 0}
.pt-acts{display:flex;gap:8px}
.pt-acts button{flex:1;padding:14px 6px}
.pc-card{position:relative;width:min(13vw, 58px);aspect-ratio:5/8;padding:0;border-radius:8px;background:#fbf7ec;border:2px solid #d8d0bc;color:#1d1d1d;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 6px;transition:transform .12s;flex:none;font-size:calc(17px * var(--fs, 1))}
.pc-card.small{width:min(9vw, 38px);font-size:13px;border-width:1px;padding:2px 0 4px}
.pc-card.sel{transform:translateY(-12px);border-color:var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.pc-card.back{background:repeating-linear-gradient(45deg,#8e2b22 0 6px,#a8362c 6px 12px);border-color:#f3efe2;justify-content:center}
.pc-card.back span{background:#f3efe2;color:#8e2b22;border-radius:6px;padding:1px 5px;font-weight:800;font-size:13px}
.pc-card.empty{background:transparent;border:2px dashed var(--line)}
.pc-r{font-weight:800;line-height:1}
.pc-o{color:#a87400}.pc-c{color:#b03024}.pc-e{color:#22508f}.pc-b{color:#2e7d32}
.pc-s{width:62%;display:block}.pc-s svg{width:100%;height:auto;display:block}
.pc-new{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--on-gold);font-style:normal;font-size:10px;font-weight:800;border-radius:6px;padding:0 4px;line-height:1.5}
.pc-card.tip{border-color:var(--gold);border-style:dashed;box-shadow:0 0 0 3px rgba(232,184,74,.35)}
.pt-btn.tip .pc-card{animation:tipPulse 1.2s ease-in-out infinite}
@keyframes tipPulse{50%{box-shadow:0 0 0 7px rgba(232,184,74,.45)}}
.pt-learn{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:calc(12px * var(--fs, 1));color:var(--mut);margin-left:4px}
.pc-m{position:absolute;left:6px;right:6px;bottom:2px;height:4px;border-radius:2px;background:var(--mc)}
.empty{text-align:center;color:var(--mut);padding:20px}
</style>
</head>
<body>
<header>
  <h1 id="title">Chinchón<small id="subtitle">Marcador de puntos</small></h1>
  <button class="icon" id="menuBtn" aria-label="Menú">⋮</button>
</header>
<div id="updBanner" role="button"></div>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="undoBar"></div>

<script src="juego.js"></script>
<script>
'use strict';
/* ================= Estado y persistencia ================= */
const KEY = 'chinchon.v1';
const DONATE_URL = 'https://www.paypal.com/ncp/payment/KJCPZWMUM3JXG';
// En la app Android (Capacitor) la navegación a otra web se abre en el navegador del sistema
function openExternal(url) {
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) { location.href = url; return; }
  const w = window.open(url, '_blank', 'noopener');
  if (!w) location.href = url;
}
/* ================= Temas de color ================= */
const THEMES = {
  tapete:   { name: 'Tapete',    bg:'#0b2a20', felt:'#0e3b2c', card:'#134a37', card2:'#1a5a43', line:'#2a6b52', txt:'#f3efe2', mut:'#a9c3b6', gold:'#e8b84a', onGold:'#2a1e00', red:'#e2574c', blue:'#5aa9e6', onBlue:'#06233a', ok:'#62c98a', outbg:'#2b2b2b' },
  noche:    { name: 'Noche',     bg:'#0d1626', felt:'#13213a', card:'#1a2c4a', card2:'#23395e', line:'#2f4a75', txt:'#eef2f8', mut:'#9fb0c8', gold:'#f2b84b', onGold:'#2a1e00', red:'#ef6b5f', blue:'#6cc3ff', onBlue:'#06233a', ok:'#5fd39a', outbg:'#262a33' },
  burdeos:  { name: 'Burdeos',   bg:'#22090e', felt:'#3a141b', card:'#4a1a23', card2:'#5c222d', line:'#7a2f3c', txt:'#f7ece4', mut:'#d0aeb0', gold:'#f0c060', onGold:'#2a1e00', red:'#ff7a6b', blue:'#7cc0f0', onBlue:'#06233a', ok:'#7ad69c', outbg:'#2e2a2b' },
  morado:   { name: 'Morado',    bg:'#160d22', felt:'#24163a', card:'#2f1d4b', card2:'#3b265e', line:'#4f3779', txt:'#f3eefa', mut:'#b6a8cc', gold:'#ffb547', onGold:'#2a1600', red:'#ff6b81', blue:'#7fb8ff', onBlue:'#06233a', ok:'#6fe0a4', outbg:'#2a2730' },

/* ================= Motor de la partida ================= */
function compute(g) {
  const c = g.cfg, P = g.players, order = P.map(p => p.id);
  const st = {};
  P.forEach(p => st[p.id] = { total: 0, out: false, rebuys: 0, outHand: null });
  let lastDealer = null, hand = 0, ended = null;
  const rows = [];
  g.events.forEach((e, idx) => {
    if (ended && ended.by === 'chinchon') return;
    if (e.t === 'hand') {
      hand++;
      const applied = {};
      for (const id in e.scores) {
        if (st[id] && !st[id].out) { st[id].total += e.scores[id]; applied[id] = e.scores[id]; }
      }
      lastDealer = e.dealer;
      const newlyOut = [];
      P.forEach(p => { const s = st[p.id]; if (!s.out && s.total > c.limit) { s.out = true; s.outHand = hand; newlyOut.push(p.id); } });
      if (e.kind === 'chinchon' && c.chinchon === 'win' && e.closer) ended = { by: 'chinchon', winner: e.closer };
      rows.push({ type: 'hand', idx, n: hand, e, applied, totals: Object.fromEntries(P.map(p => [p.id, { t: st[p.id].total, out: st[p.id].out }])), newlyOut });
    } else if (e.t === 'rebuy') {
      const s = st[e.p];
      const valid = s && s.out;
      if (valid) { s.out = false; s.total = e.score; s.rebuys++; s.outHand = null; }
      rows.push({ type: 'rebuy', idx, n: hand, e, valid });
    }
  });
  const active = P.filter(p => !st[p.id].out);
  if (!ended && hand > 0 && active.length <= 1) {
    const w = active[0] ? active[0].id : P.slice().sort((a, b) => st[a.id].total - st[b.id].total)[0].id;
    ended = { by: 'last', winner: w };
  }
  // Siguiente en dar: el siguiente jugador activo en el orden de la mesa
  let next = null;
  if (lastDealer == null) next = st[g.firstDealer] && !st[g.firstDealer].out ? g.firstDealer : (active[0] && active[0].id);
  else {
    const i = order.indexOf(lastDealer);
    for (let k = 1; k <= order.length; k++) { const id = order[(i + k) % order.length]; if (!st[id].out) { next = id; break; } }
  }
  // Quién sale (el de la derecha/siguiente del que da)
  let lead = null;
  if (next) { const i = order.indexOf(next); for (let k = 1; k < order.length; k++) { const id = order[(i + k) % order.length]; if (!st[id].out) { lead = id; break; } } }
  const totalRebuys = P.reduce((a, p) => a + st[p.id].rebuys, 0);
  const pot = (c.stake || 0) * P.length + (c.rebuyStake || 0) * totalRebuys;
  return { st, active, hand, ended, next, lead, rows, pot, totalRebuys };
}

function rebuyScore(g, R) {
  if (g.cfg.rebuyMode === 'fixed') return Number(g.cfg.rebuyFixed) || 0;
  return R.active.length ? Math.max(...R.active.map(p => R.st[p.id].total)) : 0;
}
function canRebuy(g, R, pid) {
  const s = R.st[pid], c = g.cfg;
  if (!s.out || c.rebuyMode === 'none') return false;
  if (R.ended && R.ended.by === 'chinchon') return false;
  if (!R.active.length) return false;
  if (c.maxRebuys > 0 && s.rebuys >= c.maxRebuys) return false;
  return true;
}

function readCfg(prefix) {

  };
}

function renameEverywhere(oldName, newName) {
  const k = nkey(oldName);
  const fix = g => g && g.players.forEach(p => { if (nkey(p.name) === k) p.name = newName; });
  S.archive.forEach(a => { fix(a); if (nkey(a.winnerName) === k) a.winnerName = newName; });
  fix(S.game);
  if (S.draft) S.draft.names = S.draft.names.map(n => nkey(n) === k ? newName : n);
  if (S.lastNames) S.lastNames = S.lastNames.map(n => nkey(n) === k ? newName : n);
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#000'; }
function drawShareImage({ title, subtitle, cols, rows, note }) {
  const W = 1080, P = 56, rowH = 92, headH = 70;
  const H = P + 70 + 50 + 40 + headH + rows.length * rowH + 40 + (note ? 50 : 0) + 60 + P;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');

  const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fillStyle = fill; g.fill(); };
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  let y = P;
  g.fillStyle = gold; g.font = font(800, 30); g.fillText('🃏  CHINCHÓN', P, y + 30);
  g.fillStyle = txt; g.font = font(800, 54); g.fillText(title, P, y + 100);
  g.fillStyle = mut; g.font = font(500, 32); g.fillText(subtitle, P, y + 150);
  y += 190;
  const tableH = headH + rows.length * rowH;
  rr(P, y, W - 2 * P, tableH, 28, card);
  // columnas: posición, nombre y el resto alineadas a la derecha
  const xs = [P + 30, P + 120]; const rightCols = cols.slice(2); const colW = 150;
  rightCols.forEach((_, i) => xs.push(W - P - 30 - (rightCols.length - 1 - i) * colW));
  g.fillStyle = card2; g.save(); g.beginPath(); g.rect(P, y, W - 2 * P, headH); g.clip(); rr(P, y, W - 2 * P, tableH, 28, card2); g.restore();
  g.font = font(700, 28); g.fillStyle = mut;
  cols.forEach((h, i) => { g.textAlign = i < 2 ? 'left' : 'right'; g.fillText(h, xs[i], y + 46); });
  rows.forEach((r, ri) => {
    const ty = y + headH + ri * rowH;
    if (ri) { g.fillStyle = line; g.fillRect(P + 20, ty, W - 2 * P - 40, 2); }
    r.forEach((v, i) => {
      g.textAlign = i < 2 ? 'left' : 'right';
      g.fillStyle = i === 2 ? gold : txt;
      g.font = font(i === 1 || i === 2 ? 800 : 500, i === 0 ? 40 : 38);
      let t = String(v); if (i === 1) { while (g.measureText(t).width > xs[2] - xs[1] - colW + 20 && t.length > 3) t = t.slice(0, -2) + '…'; }

  g.textAlign = 'left'; y += tableH + 50;
  if (note) { g.fillStyle = mut; g.font = font(500, 28); g.fillText(note, P, y); y += 50; }

}

const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;

  return { limit: Math.max(1, num(c.limit, 100)), closeBonus: num(c.closeBonus, -10), chinchon: c.chinchon === 'pts' ? 'pts' : 'win', chinchonPts: num(c.chinchonPts, -50),

// Devuelve una partida con solo datos válidos (ids seguros, números de verdad, textos limpios) o null
function cleanGame(g, archived) {
  if (!g || typeof g !== 'object' || !Array.isArray(g.players) || !Array.isArray(g.events)) return null;
  const map = {}, players = [];
  for (const p of g.players.slice(0, 10)) {
    if (!p) continue;
    const id = SAFE_ID.test(String(p.id)) && !map[p.id] ? String(p.id) : uid();

  const events = [];

    if (!e) continue;
    if (e.t === 'hand') {

      for (const k in (e.scores || {})) if (map[k] && ok(map[k])) scores[map[k]] = num(e.scores[k], 0);
      events.push({ t: 'hand', dealer: map[e.dealer] || players[0].id, closer: map[e.closer] || null, kind: ['normal', 'bonus', 'chinchon'].includes(e.kind) ? e.kind : 'normal', scores, at: num(e.at, 0) });

function validBackup(b) { return b && b.app === 'chinchon-marcador' && Array.isArray(b.archive); }
// Añade lo que trae la copia sin duplicar ni borrar nada de lo que ya hay
function mergeBackup(b) {
  const have = new Set(S.archive.map(a => a.id));
  const nuevas = b.archive.slice(0, MAX_ARCHIVE).map(a => cleanGame(a, true)).filter(a => a && !have.has(a.id));
  S.archive = S.archive.concat(nuevas).sort((x, y) => (y.finished || y.created || 0) - (x.finished || x.created || 0)).slice(0, MAX_ARCHIVE);
  const g = !S.game && cleanGame(b.game, false); if (g) S.game = g;
  (Array.isArray(b.roster) ? b.roster : []).map(cleanName).forEach(n => { if (n && !S.roster.some(x => nkey(x) === nkey(n))) S.roster.push(n); });
  S.archive.forEach(a => a.players.forEach(p => { if (!/^Jugador \d+$/.test(p.name) && !/^🤖/.test(p.name) && !S.roster.some(x => nkey(x) === nkey(p.name))) S.roster.push(p.name); }));
  if (!S.theme && THEMES[b.theme]) { S.theme = b.theme; applyTheme(S.theme); }
  if (!S.fontScale && FONT_SIZES.some(f => f[0] === String(b.fontScale))) { S.fontScale = String(b.fontScale); applyFont(); }
  return nuevas.length;
}

/* Copia automática (solo app Android):
   - en la memoria interna de la app: Android la incluye en su copia de seguridad de Google y la devuelve al reinstalar o cambiar de móvil;
   - en Documentos/Chinchon del móvil, si Android lo permite. */
const AUTO_FILE = 'chinchon-copia-auto.json';
let autoBackupBusy = false;
async function autoBackup(force) {
  if (!isNative() || autoBackupBusy) return;
  if (!S.archive.length && !S.game) return;
  if (!force && S.lastAutoBackup && Date.now() - S.lastAutoBackup < 3600e3) return;
  autoBackupBusy = true;
  try {
    const { Filesystem } = window.Capacitor.Plugins, data = backupJSON();
    await Filesystem.writeFile({ path: AUTO_FILE, data, directory: 'DATA', encoding: 'utf8' });
    try { await Filesystem.writeFile({ path: 'Chinchon/' + AUTO_FILE, data, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true }); S.autoBackupDocs = true; }
    catch (e) { S.autoBackupDocs = false; }
    S.lastAutoBackup = Date.now(); save();
  } catch (e) { /* sin copia esta vez; se reintenta más tarde */ }
  autoBackupBusy = false;
}
// Tras reinstalar: si la app está vacía y hay una copia, ofrecer recuperarla
async function offerRestore() {
  if (!isNative() || S.archive.length || S.game || S.restoreOffered) return;
  const { Filesystem } = window.Capacitor.Plugins;
  let b = null;
  for (const [path, directory] of [[AUTO_FILE, 'DATA'], ['Chinchon/' + AUTO_FILE, 'DOCUMENTS']]) {
    try { const r = await Filesystem.readFile({ path, directory, encoding: 'utf8' }); const j = JSON.parse(r.data); if (validBackup(j) && (j.archive.length || j.game)) { b = j; break; } } catch (e) {}
  }
  S.restoreOffered = true; save();
  if (!b) return;
  const when = new Date(b.exported).toLocaleString('es-ES', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  confirmBox('Recuperar tus partidas', `Hay una copia de seguridad del ${when} con ${b.archive.length} partida${b.archive.length === 1 ? '' : 's'}${b.game ? ' y una partida en curso' : ''}. ¿Quieres recuperarla?`, 'Recuperar', () => {
    const n = mergeBackup(b); save(); render(); toast(n + ' partidas recuperadas');
  });
}

const GROUP_TEXT = '🃏 Partidas de Chinchón. Para tenerlas en tu móvil: guarda este archivo, abre Chinchón → ⋮ → 📊 Clasificación y partidas → 📜 Partidas → «Recibir partidas del grupo» y elígelo. No se duplica nada.';
async function exportBackup(forGroup) {
  const d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
  const name = (forGroup ? 'chinchon-partidas-' : 'chinchon-copia-') + stamp + '.json';
  const data = backupJSON();
  try {
    if (isNative()) {
      const { Filesystem, Share } = window.Capacitor.Plugins;
      const r = await Filesystem.writeFile({ path: name, data, directory: 'CACHE', encoding: 'utf8' });
      await Share.share({ title: 'Partidas de Chinchón', text: forGroup ? GROUP_TEXT : 'Copia de seguridad de Chinchón · Marcador', files: [r.uri], dialogTitle: forGroup ? 'Enviar partidas al grupo' : 'Guardar copia en…' });
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast('Copia descargada');
    }
  } catch (e) {
    if (!/cancel/i.test(String(e && e.message))) toast('No se pudo exportar la copia');
  }
}
function importBackup() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json,text/plain';
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      let b;
      try { b = JSON.parse(rd.result); } catch (e) { b = null; }
      if (!validBackup(b)) { toast('Ese archivo no es una copia de Chinchón'); return; }
      const have = new Set(S.archive.map(a => a.id));
      const nuevas = b.archive.slice(0, MAX_ARCHIVE).map(a => cleanGame(a, true)).filter(a => a && !have.has(a.id));
      const restoreGame = !S.game && !!cleanGame(b.game, false);
      confirmBox('Importar copia', `Se añadirán ${nuevas.length} partida${nuevas.length === 1 ? '' : 's'} nueva${nuevas.length === 1 ? '' : 's'} al historial (las que ya tienes no se duplican)${restoreGame ? ' y se recuperará la partida que estaba en curso' : ''}.`, 'Importar', () => {
        const n = mergeBackup(b);
        save(); render(); toast(n + ' partidas importadas'); autoBackup(true); openArchive('partidas');
      });
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- Clasificación, jornadas y partidas ---------- */
const JORNADA_HOUR = 6;      // la jornada empieza a las 6:00 (una noche larga cuenta como un solo día)
const RANK_C = 10;           // partidas "virtuales" con las que se ajusta la valoración
const RANK_MIN = 5;          // con menos partidas, la valoración se marca como provisional
const pad2 = n => String(n).padStart(2, '0');
const nkey = n => String(n || '').trim().toLowerCase();
function jornadaKey(ts) { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function jornadaLabel(k) { const [y, m, d] = k.split('-').map(Number); const s = new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }

// Resultado de una partida terminada: puesto y puntos de cada jugador
function gameResult(a) {
  const R = compute(a); if (!R.ended) return null;
  const P = a.players, w = R.ended.winner;
  const surv = id => { const s = R.st[id]; return s.out ? s.outHand : 1e9; };
  const others = P.filter(p => p.id !== w).sort((x, y) => (surv(y.id) - surv(x.id)) || (R.st[x.id].total - R.st[y.id].total));
  const order = [P.find(p => p.id === w), ...others], N = order.length;
  const closes = {}, chin = {};
  a.events.forEach(e => { if (e.t === 'hand' && e.closer) { closes[e.closer] = (closes[e.closer] || 0) + 1; if (e.kind === 'chinchon') chin[e.closer] = (chin[e.closer] || 0) + 1; } });
  return {
    ts: a.finished || a.created, N, hands: R.hand,
    rows: order.map((p, i) => ({ key: nkey(p.name), name: p.name.trim(), pos: i + 1, win: i === 0,
      pts: N > 1 ? Math.round(100 * (N - 1 - i) / (N - 1)) / 10 : 10,
      rebuys: R.st[p.id].rebuys, closes: closes[p.id] || 0, chin: chin[p.id] || 0, total: R.st[p.id].total }))
  };
}
function aggregate(results) {
  const m = {};
  results.forEach(g => g.rows.forEach(r => {
    const o = m[r.key] || (m[r.key] = { name: r.name, pj: 0, g: 0, pts: 0, pos: 0, podios: 0, chin: 0, closes: 0, rebuys: 0 });
    o.name = r.name; o.pj++; o.g += r.win ? 1 : 0; o.pts += r.pts; o.pos += r.pos; o.podios += r.pos <= Math.min(3, g.N - 1 || 1) ? 1 : 0;
    o.chin += r.chin; o.closes += r.closes; o.rebuys += r.rebuys;
  }));
  const list = Object.values(m);
  const totPj = list.reduce((a, o) => a + o.pj, 0), mean = totPj ? list.reduce((a, o) => a + o.pts, 0) / totPj : 5;
  list.forEach(o => { o.avg = o.pts / o.pj; o.rating = (o.pts + RANK_C * mean) / (o.pj + RANK_C); o.avgPos = o.pos / o.pj; });
  return list;
}
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('es-ES');
const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';

/* ---------- Ficha de jugador ---------- */
function playerStats(key) {
  const all = S.archive.map(a => ({ a, r: gameResult(a) })).filter(x => x.r);
  const games = [];
  all.forEach(({ a, r }) => {
    const me = r.rows.find(x => x.key === key); if (!me) return;
    const pl = a.players.find(p => nkey(p.name) === key); const R = compute(a);
    let hp = 0, hn = 0, bonus = 0;
    R.rows.forEach(row => {
      if (row.type !== 'hand') return;
      if (pl.id in row.applied) { hn++; hp += Math.max(0, row.applied[pl.id]); }
      if (row.e.closer === pl.id && row.e.kind === 'bonus') bonus++;
    });
    games.push({ ts: r.ts, pos: me.pos, win: me.win, rebuys: me.rebuys, closes: me.closes, chin: me.chin, bonus, hp, hn, rivals: r.rows.filter(x => x.key !== key) });
  });
  if (!games.length) return null;
  games.sort((x, y) => x.ts - y.ts);
  let best = 0, cur = 0; games.forEach(g => { cur = g.win ? cur + 1 : 0; best = Math.max(best, cur); });
  const rank = aggregate(all.map(x => x.r)).sort((a, b) => (b.rating - a.rating) || (b.g - a.g) || (b.pj - a.pj));
  const ri = rank.findIndex(o => nkey(o.name) === key);
  const h2h = {};
  games.forEach(g => g.rivals.forEach(o => { const h = h2h[o.key] || (h2h[o.key] = { name: o.name, ahead: 0, behind: 0 }); h.name = o.name; if (g.pos < o.pos) h.ahead++; else h.behind++; }));
  const monthKey = ts => { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
  const byMonth = {}; all.forEach(x => (byMonth[monthKey(x.r.ts)] = byMonth[monthKey(x.r.ts)] || []).push(x.r));
  const months = [...new Set(games.map(g => monthKey(g.ts)))].sort().slice(-6).map(m => {
    const o = aggregate(byMonth[m]).find(z => nkey(z.name) === key);
    const [y, mm] = m.split('-').map(Number);
    return { label: new Date(y, mm - 1, 1).toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), v: o ? o.rating * 10 : 0 };
  });
  const sum = f => games.reduce((a, g) => a + f(g), 0);
  return {
    name: rank[ri] ? rank[ri].name : key, rankPos: ri + 1, rating: rank[ri] ? rank[ri].rating * 10 : 0,
    pj: games.length, g: sum(g => g.win ? 1 : 0), avgPos: sum(g => g.pos) / games.length,
    perHand: sum(g => g.hn) ? sum(g => g.hp) / sum(g => g.hn) : 0, best, cur,
    closes: sum(g => g.closes), bonus: sum(g => g.bonus), chin: sum(g => g.chin), rebuys: sum(g => g.rebuys),
    winAfterRebuy: sum(g => g.win && g.rebuys ? 1 : 0), since: games[0].ts,
    h2h: Object.values(h2h).sort((a, b) => (b.ahead + b.behind) - (a.ahead + a.behind)).slice(0, 8), months
  };
}

    ${st.months.length > 1 ? `<div class="pf-t">Valoración por mes</div><div class="pf-box"><div class="pf-months">` + st.months.map((m, i) => `

/* ---------- Récords ---------- */
function computeRecords() {
  const games = S.archive.map(a => ({ a, r: gameResult(a), R: compute(a) })).filter(x => x.r).sort((x, y) => x.r.ts - y.r.ts);
  if (!games.length) return [];
  const fd = ts => new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const recs = [];
  const top = (obj) => { let best = null; for (const k in obj) if (!best || obj[k].v > best.v) best = obj[k]; return best; };
  // rachas de victorias
  const streak = {}, cur = {};
  games.forEach(({ r }) => r.rows.forEach(x => { cur[x.key] = x.win ? (cur[x.key] || 0) + 1 : 0; if (!streak[x.key] || cur[x.key] > streak[x.key].v) streak[x.key] = { who: x.name, v: cur[x.key] }; }));
  const st = top(streak); if (st && st.v > 1) recs.push({ ic: '🔥', t: 'Mejor racha de victorias', who: st.who, val: st.v + ' seguidas' });
  // partida más larga y más corta
  const byHands = games.slice().sort((x, y) => y.r.hands - x.r.hands);
  const L = byHands[0], C = byHands[byHands.length - 1];
  recs.push({ ic: '⏳', t: 'Partida más larga', who: 'Ganó ' + L.r.rows[0].name, val: L.r.hands + ' manos', sub: fd(L.r.ts) });
  if (games.length > 1) recs.push({ ic: '⚡', t: 'Partida más corta', who: 'Ganó ' + C.r.rows[0].name, val: C.r.hands + ' manos', sub: fd(C.r.ts) });
  // totales por jugador
  const tot = (f) => { const m = {}; games.forEach(({ r }) => r.rows.forEach(x => { const v = f(x); if (!v) return; const o = m[x.key] || (m[x.key] = { who: x.name, v: 0 }); o.v += v; o.who = x.name; })); return top(m); };
  const ch = tot(x => x.chin); if (ch) recs.push({ ic: '★', t: 'Más chinchones', who: ch.who, val: ch.v });
  const pj = tot(() => 1); if (pj) recs.push({ ic: '🃏', t: 'Más partidas jugadas', who: pj.who, val: pj.v });
  const war = tot(x => x.win && x.rebuys ? 1 : 0); if (war) recs.push({ ic: '🦅', t: 'Más victorias tras reengancharse', who: war.who, val: war.v });
  // por partida / por mano
  let reb = null, hand = null, bonus = {};
  games.forEach(({ a, r, R }) => {
    r.rows.forEach(x => { if (x.rebuys && (!reb || x.rebuys > reb.v)) reb = { who: x.name, v: x.rebuys, ts: r.ts }; });
    R.rows.forEach(row => { if (row.type !== 'hand') return;
      for (const id in row.applied) { const v = row.applied[id]; if (!hand || v > hand.v) hand = { who: pname(a, id), v, ts: r.ts }; }
      if (row.e.kind === 'bonus' && row.e.closer) { const k = nkey(pname(a, row.e.closer)); const o = bonus[k] || (bonus[k] = { who: pname(a, row.e.closer), v: 0 }); o.v++; } });
  });
  const bo = top(bonus); if (bo) recs.push({ ic: '✓', t: 'Más cierres con todo ligado', who: bo.who, val: bo.v });
  if (reb && reb.v > 1) recs.push({ ic: '↻', t: 'Más reenganches en una partida', who: reb.who, val: reb.v, sub: fd(reb.ts) });
  if (hand && hand.v > 0) recs.push({ ic: '💥', t: 'Mano más cara', who: hand.who, val: hand.v + ' pts', sub: fd(hand.ts) });
  // jornadas
  const byDay = {}; games.forEach(({ r }) => (byDay[jornadaKey(r.ts)] = byDay[jornadaKey(r.ts)] || []).push(r));
  let bigDay = null, dayWins = null;
  for (const k in byDay) {
    const list = byDay[k]; if (!bigDay || list.length > bigDay.v) bigDay = { v: list.length, k };
    const w = {}; list.forEach(r => { const x = r.rows[0]; const o = w[x.key] || (w[x.key] = { who: x.name, v: 0 }); o.v++; });
    const t = top(w); if (t && (!dayWins || t.v > dayWins.v)) dayWins = { ...t, k };
  }
  if (dayWins && dayWins.v > 1) recs.push({ ic: '👑', t: 'Más victorias en una jornada', who: dayWins.who, val: dayWins.v, sub: jornadaLabel(dayWins.k).replace(/^[^,]+, /, '') });
  if (bigDay && bigDay.v > 1) recs.push({ ic: '📅', t: 'Jornada con más partidas', who: jornadaLabel(bigDay.k).replace(/^[^,]+, /, ''), val: bigDay.v + ' partidas' });
  return recs;
}

let AV = { tab: 'ranking', period: 'all', open: null };

  const tabs = `<div class="kinds" style="margin:0 0 12px">${[['ranking', '🏆 Ranking'], ['jornadas', '📅 Jornadas'], ['records', '🏅 Récords'], ['partidas', '📜 Partidas']].map(([k, l]) => `<button data-tab="${k}" class="${AV.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  let body = '';
  const SH = {};
  if (!S.archive.length) {
    body = `<div class="empty">Aún no hay partidas guardadas.<br>Se guardan al pulsar «Revancha», «Nueva partida» o «Terminar partida».</div>`;
  } else if (AV.tab === 'ranking') {

    const pl = { all: 'Desde siempre', year: 'Año ' + now.getFullYear(), month: now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }) }[AV.period];
    SH.rank = { file: 'chinchon-ranking.png', text: 'Ranking de chinchón 🏆', img: { title: 'Ranking de jugadores', subtitle: pl.charAt(0).toUpperCase() + pl.slice(1) + ' · ' + list.reduce((a, o) => a + o.g, 0) + ' partidas',
      cols: ['#', 'Jugador', 'Valor.', 'PJ', 'G', '% G'], rows: list.slice(0, 12).map((o, i) => [medal(i), o.name, Math.round(o.rating * 10), o.pj, o.g, Math.round(o.g / o.pj * 100) + '%']),
      note: 'Valoración 0–100: media por partida ajustada por partidas jugadas.' } };
    body = `<div class="kinds" style="margin:0 0 10px">${[['all', 'Siempre'], ['year', 'Este año'], ['month', 'Este mes']].map(([k, l]) => `<button data-period="${k}" class="${AV.period === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
      (list.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>Valor.</th><th>PJ</th><th>G</th><th>% G</th><th>Pos. media</th><th>Pts</th><th>★</th><th>↻</th></tr></thead><tbody>` +
        list.map((o, i) => `<tr data-player="${esc(o.name)}" style="cursor:pointer"><td>${medal(i)}</td><td style="text-align:left;font-weight:700;text-decoration:underline;text-decoration-color:var(--line)">${esc(o.name)}${o.pj < RANK_MIN ? ' <small class="mut">*</small>' : ''}</td><td><b style="color:var(--gold);font-size:calc(16px * var(--fs, 1))">${Math.round(o.rating * 10)}</b></td><td>${o.pj}</td><td>${o.g}</td><td>${Math.round(o.g / o.pj * 100)}%</td><td>${fmt1(o.avgPos)}º</td><td>${fmt1(o.pts)}</td><td>${o.chin || ''}</td><td>${o.rebuys || ''}</td></tr>`).join('') +
        `</tbody></table></div>
        <div class="mut" style="margin-top:6px">Toca un jugador para ver su ficha.${list.some(o => o.pj < RANK_MIN) ? ' * Menos de ' + RANK_MIN + ' partidas: valoración provisional.' : ''}</div>
        <button class="btn-ghost" data-share="rank" style="width:100%;margin-top:10px">📤 Compartir ranking como imagen</button>
        <details class="sec" style="margin-top:10px"><summary style="cursor:pointer;font-weight:700">¿Cómo se calcula?</summary>
          <div class="mut" style="margin-top:8px;line-height:1.5">
          • En cada partida se reparten <b>10 puntos al ganador y 0 al último</b>; el resto según su puesto (va por delante quien aguanta más sin eliminarse). Así cuenta igual una partida de 3 que de 6 jugadores.<br>
          • La <b>valoración</b> (0–100) es la media de puntos por partida, ajustada por el número de partidas jugadas: con pocas partidas se acerca a la media del grupo, y según juegas más refleja tu nivel real. Nadie se pone primero por una victoria con suerte.<br>
          • PJ = partidas jugadas · G = ganadas · Pos. media = puesto medio · ★ = chinchones · ↻ = reenganches.<br>
          • Solo cuentan las partidas terminadas.</div></details>`
        : '<div class="empty">No hay partidas terminadas en este periodo.</div>');
  } else if (AV.tab === 'jornadas') {
    const byDay = {};
    done.forEach(x => { const k = jornadaKey(x.r.ts); (byDay[k] = byDay[k] || []).push(x.r); });
    const days = Object.keys(byDay).sort().reverse();
    if (AV.open == null && days.length) AV.open = days[0];
    body = days.length ? days.map(k => {
      const res = byDay[k], list = aggregate(res).sort((a, b) => (b.pts - a.pts) || (b.g - a.g) || (a.avgPos - b.avgPos));
      const isOpen = AV.open === k;
      SH['j' + k] = { file: 'chinchon-jornada-' + k + '.png', text: 'Resultado de la jornada de chinchón 🃏', img: { title: 'Jornada · ' + jornadaLabel(k).replace(/ de \d{4}$/, ''), subtitle: res.length + ' partida' + (res.length === 1 ? '' : 's') + ' · 🏆 ' + list[0].name,
        cols: ['#', 'Jugador', 'Pts', 'PJ', 'G', 'Pos.'], rows: list.slice(0, 12).map((o, i) => [medal(i), o.name, fmt1(o.pts), o.pj, o.g, fmt1(o.avgPos) + 'º']),
        note: 'Puntos por partida: 10 al ganador, 0 al último.' } };
      return `<div class="hrow" style="padding:0;overflow:hidden">
        <div class="top" data-day="${k}" style="padding:12px;cursor:pointer"><div class="n">${esc(jornadaLabel(k))}<small>${res.length} partida${res.length === 1 ? '' : 's'} · 🏆 ${esc(list[0].name)} (${fmt1(list[0].pts)} pts)</small></div><span>${isOpen ? '▾' : '▸'}</span></div>
        ${isOpen ? `<div class="tbl-wrap" style="border-radius:0"><table><thead><tr><th>#</th><th style="text-align:left">Jugador</th><th>Pts</th><th>PJ</th><th>G</th><th>Pos. media</th><th>★</th><th>↻</th></tr></thead><tbody>` +
          list.map((o, i) => `<tr data-player="${esc(o.name)}" style="cursor:pointer"><td>${medal(i)}</td><td style="text-align:left;font-weight:700;text-decoration:underline;text-decoration-color:var(--line)">${esc(o.name)}</td><td><b style="color:var(--gold)">${fmt1(o.pts)}</b></td><td>${o.pj}</td><td>${o.g}</td><td>${fmt1(o.avgPos)}º</td><td>${o.chin || ''}</td><td>${o.rebuys || ''}</td></tr>`).join('') +
          `</tbody></table></div><div style="padding:10px"><button class="btn-ghost" data-share="j${k}" style="width:100%">📤 Compartir jornada como imagen</button></div>` : ''}
      </div>`;
    }).join('') + '<div class="mut">Puntos por partida: 10 al ganador, 0 al último y el resto según su puesto. La jornada va de 6:00 a 6:00.</div>'
      : '<div class="empty">Aún no hay partidas terminadas.</div>';
  } else if (AV.tab === 'records') {
    const recs = computeRecords();
    SH.records = { file: 'chinchon-records.png', text: 'Récords de chinchón 🏅', img: { title: 'Récords', subtitle: done.length + ' partidas jugadas',
      cols: ['', 'Récord', 'Valor'], rows: recs.slice(0, 12).map(r => [r.ic, r.t + ': ' + r.who, r.val]), note: '' } };
    body = recs.length ? recs.map(r => `<div class="hrow"><div class="top"><div style="font-size:calc(24px * var(--fs, 1));width:34px;text-align:center">${r.ic}</div>
        <div class="n">${esc(r.t)}<small>${esc(r.who)}${r.sub ? ' · ' + esc(r.sub) : ''}</small></div>
        <b style="color:var(--gold);white-space:nowrap">${esc(String(r.val))}</b></div></div>`).join('') +
      '<button class="btn-ghost" data-share="records" style="width:100%;margin-top:6px">📤 Compartir récords como imagen</button>'
      : '<div class="empty">Aún no hay partidas terminadas.</div>';
  } else {
    body = archiveHtml(S.archive.length) + `<div class="mut" style="margin:6px 0">Caben hasta ${MAX_ARCHIVE} partidas; al superarlas se borra la más antigua.</div>` +
      (isNative() ? `<div class="hrow mut" style="line-height:1.45">💾 <b>Copia automática:</b> ${S.lastAutoBackup ? 'última el ' + new Date(S.lastAutoBackup).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'se hará al terminar la próxima partida'}.
        Se guarda en la app (Android la incluye en tu copia de Google)${S.autoBackupDocs ? ' y en la carpeta <b>Documentos/Chinchon</b> del móvil' : ''}.
        Para pasar las partidas a otro móvil, usa también «Exportar».</div>` : '');
  }
  openModal(`<h3>📊 Clasificación y partidas</h3><div class="sub">${S.archive.length} partida${S.archive.length === 1 ? '' : 's'} guardada${S.archive.length === 1 ? '' : 's'}.</div>
    ${S.archive.length ? tabs : ''}${body}
    ${AV.tab === 'partidas' || !S.archive.length ? `<div class="pf-t" style="margin-top:14px">👥 Jugar en grupo</div>
      <div class="mut" style="margin-bottom:8px;line-height:1.45">Para que todos tengáis el mismo historial y ranking: quien anote una partida la envía al grupo y los demás la reciben. Las partidas que ya tengas no se duplican.</div>
      <div class="menu">${S.archive.length ? '<button id="aGrp" class="btn-gold">📤 Enviar mis partidas al grupo</button>' : ''}<button id="aImp">📥 Recibir partidas del grupo (o una copia)</button>
      ${S.archive.length ? '<button id="aExp">💾 Guardar copia de seguridad</button>' : ''}</div>` : ''}
    <div class="acts"><button class="btn-gold" id="aC">Cerrar</button></div>`);
  $('#aC').onclick = closeModal;
  const ex = $('#aExp'); if (ex) ex.onclick = () => exportBackup(false);
  const gr = $('#aGrp'); if (gr) gr.onclick = () => exportBackup(true);
  const im = $('#aImp'); if (im) im.onclick = importBackup;
  document.querySelectorAll('#modal [data-tab]').forEach(b => b.onclick = () => openArchive(b.dataset.tab));
  document.querySelectorAll('#modal [data-period]').forEach(b => b.onclick = () => { AV.period = b.dataset.period; openArchive(); });
  document.querySelectorAll('#modal [data-day]').forEach(b => b.onclick = () => { AV.open = AV.open === b.dataset.day ? '' : b.dataset.day; openArchive(); });
  document.querySelectorAll('#modal [data-player]').forEach(tr => tr.onclick = () => openPlayer(tr.dataset.player, () => openArchive()));
  document.querySelectorAll('#modal [data-share]').forEach(b => b.onclick = () => { const d = SH[b.dataset.share]; if (d) shareImage(drawShareImage(d.img), d.file, d.text); });
  document.querySelectorAll('#modal [data-arch]').forEach(el => el.onclick = () => showArchived(+el.dataset.arch));
}

/* ---------- Partida en curso ---------- */
function renderGame() {
  const g = S.game, R = compute(g), c = g.cfg;
  if (g.play && !R.ended) return renderTable(g, R);
  clearTimeout(playTimer);
  $('#subtitle').textContent = R.ended ? 'Partida terminada' : `Mano ${R.hand + 1} · límite ${c.limit}`;
  let html = '';
  if (R.ended) {
    const anyRebuy = g.players.some(p => canRebuy(g, R, p.id));
    html += `<div class="winner"><div>${R.ended.by === 'chinchon' ? '¡CHINCHÓN!' : 'Ganador'}</div>
      <div class="big">🏆 ${esc(pname(g, R.ended.winner))}</div>
      <div style="font-size:calc(14px * var(--fs, 1));margin-top:4px">${R.hand} manos${R.pot ? ` · Bote ${fmtMoney(R.pot)}` : ''}</div>
      ${anyRebuy ? '<div style="font-size:calc(13px * var(--fs, 1));margin-top:6px">Aún se puede reenganchar algún jugador para seguir.</div>' : ''}
      <div class="actions"><button id="rematch">Revancha</button><button id="newGame">Nueva partida</button></div></div>`;
  } else {
    html += `<div class="status">
      <div class="chip">Da: <b>${esc(pname(g, R.next))}</b></div>
      ${R.lead ? `<div class="chip">Sale: <b>${esc(pname(g, R.lead))}</b></div>` : ''}
      ${R.pot ? `<div class="chip">Bote: <b>${fmtMoney(R.pot)}</b></div>` : ''}
    </div>`;
  }
  html += '<div class="players">' + g.players.map(p => {
    const s = R.st[p.id], pct = Math.max(0, Math.min(100, s.total / c.limit * 100));
    const cls = pct >= 85 ? 'danger' : pct >= 65 ? 'warn' : '';
    const isDealer = !R.ended && p.id === R.next, isLead = !R.ended && p.id === R.lead;
    const left = c.limit - s.total;
    return `<div class="pc ${s.out ? 'out' : ''} ${isDealer ? 'dealer' : ''} ${isLead ? 'lead' : ''}">
      ${isDealer ? '<div class="badge">DA</div>' : ''}
      <div class="nm">${esc(p.name)}</div>
      <div class="tt">${s.total}</div>
      <div class="bar"><i class="${cls}" style="width:${pct}%"></i></div>
      <div class="ft"><span>${s.out ? 'Eliminado' : (left >= 0 ? 'Le quedan ' + left : '')}</span><span>${s.rebuys ? '↻ ' + s.rebuys : ''}</span></div>
      ${canRebuy(g, R, p.id) ? `<button class="rb" data-rebuy="${p.id}">Reenganchar (${rebuyScore(g, R)})</button>` : ''}
    </div>`;
  }).join('') + '</div>';

  html += `<div class="sec" style="padding:0;background:none"><h2 style="padding:0 2px">Manos</h2>
    ${R.rows.length ? historyTable(g, R, true) : '<div class="empty">Aún no hay manos. Pulsa «Anotar mano» al terminar cada mano.</div>'}</div>`;
  if (!R.ended) html += `<button class="btn-gold fab" id="addHand">＋ Anotar mano ${R.hand + 1}</button>`;
  $('#app').innerHTML = html;

  const add = $('#addHand'); if (add) add.onclick = () => openHand(null);
  document.querySelectorAll('[data-rebuy]').forEach(b => b.onclick = () => doRebuy(b.dataset.rebuy));
  document.querySelectorAll('tr.hand').forEach(tr => tr.onclick = () => openHand(+tr.dataset.idx));
  document.querySelectorAll('tr.rebuy').forEach(tr => tr.onclick = () => {
    const idx = +tr.dataset.idx;
    confirmBox('Anular reenganche', 'Se quitará este reenganche del historial.', 'Anular', () => { g.events.splice(idx, 1); render(); }, true);
  });
  const rm = $('#rematch'); if (rm) rm.onclick = () => finishAndNew(true);
  const ng = $('#newGame'); if (ng) ng.onclick = () => finishAndNew(false);
  if (R.ended && !g._celebrated) { g._celebrated = true; vibrate([80, 60, 160]); save(); }
  if (!R.ended && g._celebrated) { delete g._celebrated; save(); }
}
function fmtMoney(v) { return (Math.round(v * 100) / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' }); }

function historyTable(g, R, interactive) {
  const P = g.players;
  const head = '<tr><th>#</th>' + P.map(p => `<th>${esc(p.name)}</th>`).join('') + '</tr>';
  const body = R.rows.map(r => {
    if (r.type === 'rebuy') {
      return `<tr class="${interactive ? 'rebuy' : ''}" data-idx="${r.idx}" style="${r.valid ? '' : 'text-decoration:line-through'}"><td>↻</td><td colspan="${P.length}" style="text-align:left">${esc(pname(g, r.e.p))} se reengancha con ${r.e.score}${r.valid ? '' : ' (no válido)'}</td></tr>`;
    }
    const e = r.e;
    return `<tr class="${interactive ? 'hand' : ''}" data-idx="${r.idx}"><td>${r.n} <span class="dl">${esc(initials(pname(g, e.dealer)))}</span></td>` + P.map(p => {
      const t = r.totals[p.id];
      if (!(p.id in r.applied)) return `<td class="out">${r.newlyOut.includes(p.id) ? '' : '—'}</td>`;
      const v = r.applied[p.id];
      const isCl = e.closer === p.id;
      const mark = isCl ? (e.kind === 'chinchon' ? '★' : e.kind === 'bonus' ? '✓' : '✓') : '';
      return `<td class="${isCl ? 'cl' : ''}"><span class="pt">${mark}${v > 0 ? '+' + v : v}</span><span class="to" style="${t.out ? 'color:var(--red)' : ''}">${t.t}${r.newlyOut.includes(p.id) ? ' ✗' : ''}</span></td>`;
    }).join('') + '</tr>';
  }).join('');
  return `<div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
    ${interactive ? '<div class="mut" style="margin-top:6px">Toca una mano para corregirla. ✓ cerró · ★ chinchón · ✗ eliminado · iniciales = quién dio.</div>' : ''}`;
}
function initials(n) { return n.split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase(); }

function doRebuy(pid) {
  const g = S.game, R = compute(g), score = rebuyScore(g, R);
  const money = g.cfg.rebuyStake ? ` Pone ${fmtMoney(g.cfg.rebuyStake)} al bote.` : '';
  confirmBox('Reenganchar a ' + pname(g, pid), `Vuelve a la partida con ${score} puntos.${money}`, 'Reenganchar', () => {
    g.events.push({ t: 'rebuy', p: pid, score, at: Date.now() });
    vibrate(40); toast(pname(g, pid) + ' vuelve con ' + score);
    render();
  });
}

function finishAndNew(rematch) {
  const g = S.game, R = compute(g);
  if (R.hand > 0) {
    S.archive.unshift({ ...g, finished: Date.now(), hands: R.hand, winnerName: R.ended ? pname(g, R.ended.winner) : '(sin terminar)' });
    S.archive = S.archive.slice(0, MAX_ARCHIVE);
    setTimeout(() => autoBackup(true), 500);
  }
  if (rematch) {
    // Revancha: mismos jugadores y reglas; da el siguiente al que dio primero
    const order = g.players.map(p => p.id), i = order.indexOf(g.firstDealer);
    const players = g.players.map(p => ({ id: uid(), name: p.name }));
    S.game = { id: uid(), created: Date.now(), cfg: Object.assign({}, g.cfg), players, firstDealer: players[(i + 1) % players.length].id, events: [] };
    if (g.play) S.game.play = { level: g.play.level, learn: !!g.play.learn, bots: g.players.map((p, k) => g.play.bots.includes(p.id) ? players[k].id : null).filter(Boolean), hand: null };
  } else {
    S.draft.names = g.players.map(p => p.name); S.draft.cfg = Object.assign({}, g.cfg); S.draft.dealer = 0;
    S.game = null;
  }
  render();
}

/* ---------- Anotar / corregir mano ---------- */
let undoT;
function showUndo(msg, ev) {
  const b = $('#undoBar'); clearTimeout(undoT);
  b.innerHTML = `<span>${esc(msg)}</span><button id="undoBtn">↶ Deshacer</button>`;
  b.classList.add('on');
  $('#undoBtn').onclick = () => {
    const g = S.game; b.classList.remove('on'); clearTimeout(undoT);
    if (g && g.events.length && g.events[g.events.length - 1] === ev) { g.events.pop(); vibrate(20); render(); toast('Mano deshecha'); }
  };
  undoT = setTimeout(() => b.classList.remove('on'), 6000);
}
function hideUndo() { clearTimeout(undoT); const b = $('#undoBar'); if (b) b.classList.remove('on'); }

function openHand(editIdx) {
  hideUndo();
  const g = S.game, c = g.cfg;
  const editing = editIdx != null;
  const R = compute(g);
  let participants, H;
  if (editing) {
    const e = g.events[editIdx];
    participants = g.players.filter(p => p.id in e.scores);
    H = { dealer: e.dealer, closer: e.closer || null, kind: e.kind || 'normal', scores: Object.fromEntries(Object.entries(e.scores).map(([k, v]) => [k, String(v)])) };
  } else {
    participants = R.active;
    H = { dealer: R.next, closer: null, kind: 'normal', scores: {} };
  }
  const n = editing ? R.rows.find(r => r.idx === editIdx).n : R.hand + 1;
  const isFixed = id => H.closer === id && H.kind !== 'normal';
  const fixedVal = () => H.kind === 'bonus' ? c.closeBonus : (c.chinchon === 'win' ? 0 : c.chinchonPts);
  const editable = () => participants.filter(p => !isFixed(p.id));
  H.active = (editable()[0] || {}).id || null;

  const showVal = id => { const v = isFixed(id) ? fixedVal() : (H.scores[id] ?? ''); return v === '' ? '–' : v; };
  // siguiente jugador: el de abajo; desde el último, el primero que siga vacío
  const nextId = () => { const ed = editable(), i = ed.findIndex(p => p.id === H.active);
    if (i >= 0 && i < ed.length - 1) return ed[i + 1].id;
    const empty = ed.find(p => p.id !== H.active && (H.scores[p.id] ?? '') === '' && H.closer !== p.id); return empty ? empty.id : null; };
  const paint = () => {
    document.querySelectorAll('[data-sc]').forEach(b => { b.textContent = showVal(b.dataset.sc); b.classList.toggle('on', b.dataset.sc === H.active); });
    document.querySelectorAll('[data-row]').forEach(r => r.classList.toggle('act', r.dataset.row === H.active));
    const nx = $('#kNext'); if (nx) nx.disabled = !nextId();
    const sh = document.querySelector('.sheet'), kf = document.querySelector('.kfoot');
    if (sh && kf) sh.style.scrollPaddingBottom = (kf.offsetHeight + 8) + 'px';
    const a = document.querySelector('[data-row="' + H.active + '"]'); if (a) a.scrollIntoView({ block: 'nearest' });
  };
  const press = k => {
    if (k === 'next') { const nid = nextId(); if (nid) { H.active = nid; paint(); } return; }
    if (!H.active || isFixed(H.active)) return;
    let v = String(H.scores[H.active] ?? '');
    if (k === 'del') v = v.slice(0, -1);
    else if (v.length < 3) v = (v === '0' ? '' : v) + k;
    H.scores[H.active] = v; $('#hErr').textContent = ''; paint();
  };

  const draw = () => {
    if (H.active && isFixed(H.active)) H.active = (editable()[0] || {}).id || null;
    const rowsHtml = participants.map(p => {
      const isCl = H.closer === p.id;
      return `<div class="hrow" data-row="${p.id}">
        <div class="top">
          <div class="n">${esc(p.name)}<small>${editing ? '' : 'Lleva ' + R.st[p.id].total}${p.id === H.dealer ? (editing ? 'dio' : ' · da') : ''}</small></div>
          <button class="closebtn ${isCl ? 'on' : ''}" data-close="${p.id}">${isCl ? '✓ Cerró' : 'Cerró'}</button>
          <button class="scbox ${isFixed(p.id) ? 'fixed' : ''}" data-sc="${p.id}" aria-label="Puntos de ${esc(p.name)}"></button>
        </div>
        ${isCl ? `<div class="kinds">
          <button data-kind="normal" class="${H.kind === 'normal' ? 'on' : ''}">Normal</button>
          <button data-kind="bonus" class="${H.kind === 'bonus' ? 'on' : ''}">Todo ligado (${c.closeBonus})</button>
          <button data-kind="chinchon" class="${H.kind === 'chinchon' ? 'on' : ''}">★ Chinchón</button>
        </div>` : ''}
      </div>`;
    }).join('');
    openModal(`
      <div class="hand">
      <h3>${editing ? 'Corregir' : 'Anotar'} mano ${n}</h3>
      <label class="f" style="margin-bottom:6px"><span>Dio</span>
        <select id="hDealer">${(editing ? g.players : participants).map(p => `<option value="${p.id}" ${p.id === H.dealer ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></label>
      ${rowsHtml}
      </div>
      <div class="kfoot">
        <div class="err" id="hErr"></div>
        <div class="keypad" id="keypad">
          <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="del" aria-label="Borrar">⌫</button>
          <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="0">0</button>
          <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="next" class="knext" id="kNext" aria-label="Siguiente jugador">Sig. ›</button>
        </div>
        <div class="acts" style="margin-top:10px">
          ${editing ? '<button class="btn-red" id="hDel">Borrar mano</button>' : '<button class="btn-ghost" id="hCancel">Cancelar</button>'}
          <button class="btn-gold" id="hSave">Guardar</button>
        </div>
      </div>`);
    $('#hDealer').onchange = e => { H.dealer = e.target.value; draw(); };
    document.querySelectorAll('[data-sc]').forEach(b => b.onclick = () => { if (isFixed(b.dataset.sc)) return; H.active = b.dataset.sc; paint(); });
    document.querySelectorAll('[data-row] .n').forEach(el => el.onclick = () => { const id = el.closest('[data-row]').dataset.row; if (!isFixed(id)) { H.active = id; paint(); } });
    document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { const id = b.dataset.close; if (H.closer === id) { H.closer = null; H.kind = 'normal'; } else { H.closer = id; } draw(); });
    document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { H.kind = b.dataset.kind; draw(); });
    document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { vibrate(8); press(b.dataset.k); });
    const cancel = $('#hCancel'); if (cancel) cancel.onclick = closeModal;
    const del = $('#hDel'); if (del) del.onclick = () => confirmBox('Borrar mano ' + n, 'Se recalcularán todos los totales.', 'Borrar', () => { g.events.splice(editIdx, 1); render(); }, true);
    $('#hSave').onclick = save;
    paint();
  };
  // teclado físico (útil en tablet o con teclado bluetooth)
  window.onkeydown = e => {
    if (!document.getElementById('keypad')) return;
    if (/^[0-9]$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
    else if (e.key === 'Tab') { press('next'); e.preventDefault(); }
    else if (e.key === 'Enter') { if (nextId()) press('next'); else save(); e.preventDefault(); }
  };
  function save() {
    const scores = {}; const err = $('#hErr');
    for (const p of participants) {
      if (isFixed(p.id)) { scores[p.id] = fixedVal(); continue; }
      const raw = H.scores[p.id];
      if (raw === '' || raw == null) {
        if (H.closer === p.id) { scores[p.id] = 0; continue; }
        err.textContent = 'Falta la puntuación de ' + p.name + '.'; H.active = p.id; paint(); return;
      }
      const v = Number(raw);
      if (!Number.isFinite(v) || Math.round(v) !== v || v < 0) { err.textContent = 'Puntuación no válida para ' + p.name + '.'; H.active = p.id; paint(); return; }
      scores[p.id] = v;
    }
    const ev = { t: 'hand', dealer: H.dealer, closer: H.closer, kind: H.closer ? H.kind : 'normal', scores, at: Date.now() };
    if (editing) { ev.at = g.events[editIdx].at; g.events[editIdx] = ev; }
    else g.events.push(ev);
    closeModal(); vibrate(30);
    const R2 = compute(g);
    const outs = (R2.rows.find(r => r.type === 'hand' && r.n === n) || {}).newlyOut || [];
    render();
    if (editing) toast('Mano corregida');
    else showUndo('Mano ' + n + ' anotada' + (outs.length ? ' · Eliminado: ' + outs.map(id => pname(g, id)).join(', ') : '') + (R2.ended ? ' · Fin de la partida' : ''), ev);
  }
  draw();
}

  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});

} else if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
